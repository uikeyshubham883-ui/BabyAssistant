<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Baby Assistant AI</title>

<style>
body {
  background: #101827;
  color: white;
  font-family: Arial;
  text-align: center;
  padding: 20px;
}
.box {
  background: #243047;
  padding: 25px;
  border-radius: 20px;
  margin-top: 50px;
}
h1 { color: #8bafff; }
input {
  width: 90%;
  padding: 15px;
  border-radius: 12px;
  border: none;
}
button {
  padding: 15px;
  margin: 10px;
  border: none;
  border-radius: 12px;
  background: #647cff;
  color: white;
  font-size: 17px;
}
#answer {
  font-size: 18px;
  margin-top: 25px;
}
</style>
</head>

<body>

<div class="box">
<h1>🤖 Baby Assistant</h1>
<p>नमस्ते! मैं आपका Baby Assistant हूँ।</p>

<input id="question" placeholder="यहाँ अपना सवाल लिखें">

<br>

<button onclick="reply()">पूछें 💬</button>

<button onclick="listen()">🎤 बोलें</button>

<p id="answer">मैं आपकी मदद के लिए तैयार हूँ।</p>
</div>

<script>

function speak(text) {
  let voice = new SpeechSynthesisUtterance(text);
  voice.lang = "hi-IN";
  speechSynthesis.speak(voice);
}

function reply() {
  let q = document.getElementById("question").value;

  if (!q.trim()) {
    speak("कृपया पहले कुछ पूछिए।");
    return;
  }

  let answer = "आपने पूछा " + q +
  "। मैं Baby Assistant हूँ। आपकी मदद के लिए तैयार हूँ।";

  document.getElementById("answer").innerText = answer;
  speak(answer);
}

function listen() {
  const SpeechRecognition =
    window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    alert("आपके ब्राउज़र में Voice Recognition उपलब्ध नहीं है।");
    return;
  }

  let recognition = new SpeechRecognition();
  recognition.lang = "hi-IN";
  recognition.start();

  recognition.onresult = function(event) {
    let text = event.results[0][0].transcript;
    document.getElementById("question").value = text;
    reply();
  };
}

</script>

</body>
</html>
